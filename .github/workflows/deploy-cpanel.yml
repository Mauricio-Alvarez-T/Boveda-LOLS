name: Deploy Bóveda LOLS to cPanel 🚀

# MÉTODO PULL-SIDE (2026-06-16): el FTP de cPanel banea de forma persistente la
# IP del runner de GitHub (cPHulk) → "Connection refused" también en prod. En
# vez de empujar por FTP, este workflow SOLO compila el frontend y publica
# `frontend/dist` + `backend/` en la rama `deploy-prod`. El SERVIDOR hace
# `git pull` de esa rama (saliente, no bloqueada) vía cron y se auto-despliega.
# Ver scripts/cpanel-deploy-prod.sh y docs/PLAYBOOK_PULL_SIDE_CPANEL.md (§7).

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Mismo patrón y mismas razones que en el workflow de staging (ver el comentario de
# deploy-cpanel-staging.yml): la llave es la rama de destino porque el recurso en disputa es
# `deploy-prod`, y el run más nuevo cancela al viejo para no publicar nunca un build superado.
# Acá importa más que en staging: un release a main no debería pintar rojo por una carrera.
# Contrapartida asumida: si el único run que queda falla, no se publica nada y el servidor sigue
# sirviendo el build anterior hasta que se vuelva a empujar — conviene mirar el run antes de dar
# un rollback por hecho (RUNBOOK § "Rollback de un deploy fallido").
#
# Un run con el ref EQUIVOCADO (ver la guarda de rama del job) no debe entrar a este grupo: si
# entrara, lo primero que haría sería cancelar el release legítimo en curso y recién después
# morir en la guarda. Por eso el ref inválido cae en un grupo propio y descartable (único por
# run) y muere solo.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'publicar-deploy-prod' || format('deploy-prod-ref-invalido-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: write   # para publicar la rama deploy-prod con GITHUB_TOKEN

jobs:
  build-and-publish:
    name: 🎉 Build & publicar rama deploy-prod
    runs-on: ubuntu-latest

    steps:
      # GUARDA DE RAMA (2026-09-16) — el reverso del agujero de staging (mismo comentario en
      # deploy-cpanel-staging.yml). `workflow_dispatch` no restringe el ref: correr este
      # workflow a mano desde `develop` (o desde una rama de feature) compilaba ESE árbol y lo
      # empujaba a `deploy-prod` con `push -f` → el cron de producción lo bajaba en ≤5 min
      # (despliega por DESIGUALDAD de SHA, no por ancestría) y boveda.lols.cl quedaba corriendo
      # código sin release, con sus migraciones aplicadas sobre la base de PRODUCCIÓN. Run
      # verde, cero señales.
      #
      # Se mantiene el dispatch (único modo de republicar a mano si el run de un push falla),
      # pero solo desde `main`. OJO: en un dispatch GitHub usa el workflow DEL REF ELEGIDO, así
      # que esta guarda no frena un dispatch desde una rama que todavía no la tenga.
      - name: 🛡️ Guarda de rama — producción solo se publica desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Rama equivocada::Este workflow publica deploy-prod (boveda.lols.cl) y SOLO puede correr desde 'main'. Vino de '${{ github.ref }}'. No se compiló ni publicó nada."
          exit 1

      - name: 🚚 Obtener el código (historial completo para poder pushear rama)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Dependencias Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Compilar Frontend (React)
        working-directory: ./frontend
        run: npm run build

      - name: 🌿 Publicar dist + backend a la rama deploy-prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # frontend/dist está en .gitignore → forzar su inclusión en este commit
          git add -f frontend/dist
          git commit -m "build(prod): dist de ${GITHUB_SHA::7} [skip ci]" \
            || echo "ℹ️ sin cambios nuevos para commitear (dist idéntico)"
          # La rama deploy-prod NO dispara workflows (solo develop/main lo hacen).
          git push -f origin HEAD:deploy-prod
          echo "✅ Rama deploy-prod actualizada. El servidor la baja vía cron (git pull saliente)."
