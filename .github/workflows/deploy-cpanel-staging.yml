name: Deploy Staging to cPanel 🧪

# MÉTODO PULL-SIDE (2026-06-12): el FTP de cPanel rechaza la IP entrante del
# runner de GitHub (cPHulk / firewall de IPs cloud) → "Connection refused".
# En vez de empujar por FTP, este workflow SOLO compila el frontend y publica
# `frontend/dist` + `backend/` en la rama `deploy-staging`. El SERVIDOR hace
# `git pull` de esa rama (conexión saliente, no bloqueada) vía cron y se
# auto-despliega. Ver scripts/cpanel-deploy-staging.sh y docs/RUNBOOK.md.

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Un push puede llegar a GitHub como DOS eventos (pasó con afcbf20 el 2026-09-16: cuatro runs
# para un solo `git push`). Los dos deploys compilan lo mismo y pelean por publicar la rama
# `deploy-staging`; el que llega segundo muere con "cannot lock ref ... is at X but expected Y"
# (el `push -f` no salva la carrera: el servidor rechaza la transacción si la ref se movió
# mientras se empujaba) y deja el commit pintado en rojo sin que nada esté roto.
#
# La llave del grupo es la RAMA DE DESTINO, no `github.ref`: lo que se disputan los runs es
# `deploy-staging`, y con la llave puesta en el ref de origen un `workflow_dispatch` desde otra
# rama (el desplegable de "Run workflow" viene preseleccionado con `main`) caería en otro grupo,
# correría en paralelo y volvería a chocar — publicando además el árbol de main en staging.
#
# `cancel-in-progress: true` porque acá el run más nuevo siempre manda: si a los 40 s de empujar
# un commit malo se empuja el arreglo, el run del commit malo se cancela ANTES de publicar
# (el push son los últimos segundos de un run de ~55 s) y el build superado nunca sale de GitHub.
# Cancelar a mitad del push es inocuo: la actualización de la ref es atómica del lado del servidor.
# Contrapartida asumida: solo queda UN candidato a publicar, así que si ese run falla no se publica
# nada y el cron dirá "sin cambios" — hay que volver a empujar. Y los runs cancelados salen en gris:
# NO re-ejecutar uno viejo, porque el paso de publicación es un `push -f` sin guarda y rebobinaría
# la rama a un build anterior (ver la tabla de errores comunes del RUNBOOK).
concurrency:
  group: publicar-deploy-staging
  cancel-in-progress: true

permissions:
  contents: write   # para publicar la rama deploy-staging con GITHUB_TOKEN

jobs:
  build-and-publish:
    name: 🎉 Build & publicar rama deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obtener el código (historial completo para poder pushear rama)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Dependencias Frontend
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Compilar Frontend (React)
        working-directory: ./frontend
        run: npm run build
        env:
          # Enciende la franja "Entorno de pruebas" del frontend (EntornoBanner). Producción no la define.
          VITE_ENTORNO: staging

      - name: 🌿 Publicar dist + backend a la rama deploy-staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # frontend/dist está en .gitignore → forzar su inclusión en este commit
          git add -f frontend/dist
          git commit -m "build(staging): dist de ${GITHUB_SHA::7} [skip ci]" \
            || echo "ℹ️ sin cambios nuevos para commitear (dist idéntico)"
          # La rama deploy-staging NO dispara workflows (solo develop/main lo hacen).
          git push -f origin HEAD:deploy-staging
          echo "✅ Rama deploy-staging actualizada. El servidor la baja vía cron (git pull saliente)."
